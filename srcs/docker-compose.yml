services:
  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    ports:
      - "8443:443"
    volumes:
      - ${VOLUME_BASE}/data/wordpress_files:/var/www/html
      - ${VOLUME_BASE}/data/nginx_ssl/cert.pem:/etc/nginx/ssl/cert.pem:ro
      - ${VOLUME_BASE}/data/nginx_ssl/key.pem:/etc/nginx/ssl/key.pem:ro
    environment:
      - LOGIN=${LOGIN}
      - DOMAIN=${LOGIN}.42.fr
      - BACKEND_SERVICE=${BACKEND_SERVICE:-wordpress}
      - BACKEND_PORT=${BACKEND_PORT:-9000}
      - BACKEND_PROTOCOL=${BACKEND_PROTOCOL:-fastcgi}
      - APP_ROOT=${APP_ROOT:-/var/www/html}
    depends_on:
      - wordpress
    networks:
      - inception

  wordpress:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    volumes:
      - ${VOLUME_BASE}/data/wordpress_files:/var/www/html
    environment:
      - WORDPRESS_DB_HOST=mariadb
      - WORDPRESS_DB_NAME=${DB_NAME}
      - WORDPRESS_DB_USER=${DB_USER}
      - WORDPRESS_DB_PASSWORD=${DB_PASSWORD}
      - DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - WORDPRESS_URL=https://${LOGIN}.42.fr:8443
      - WORDPRESS_TITLE=${WP_TITLE}
      - WORDPRESS_ADMIN_USER=${WP_ADMIN_USER}
      - WORDPRESS_ADMIN_PASSWORD=${WP_ADMIN_PASSWORD}
      - WORDPRESS_ADMIN_EMAIL=${WP_ADMIN_EMAIL}
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - inception

  mariadb:
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    volumes:
      - ${VOLUME_BASE}/data/wordpress_db:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - inception

# volumes:
  # wordpress_db:
  #   driver: local
  # wordpress_files:
  #   driver: local
  # nginx_ssl:
  #   driver: local

networks:
  inception:
    driver: bridge
