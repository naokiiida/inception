services:
  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ${VOLUME_BASE}/data/wordpress_files:/var/www/html
      - ${VOLUME_BASE}/data/nginx_ssl/cert.pem:/etc/nginx/ssl/cert.pem:ro
      - ${VOLUME_BASE}/data/nginx_ssl/key.pem:/etc/nginx/ssl/key.pem:ro
    environment:
      - LOGIN=${LOGIN}
      - DOMAIN=${LOGIN}.42.fr
      - BACKEND_SERVICE=${BACKEND_SERVICE:-wordpress}
      - BACKEND_PORT=${BACKEND_PORT:-9000}
      - BACKEND_PROTOCOL=${BACKEND_PROTOCOL:-fastcgi}
      - APP_ROOT=${APP_ROOT:-/var/www/html}
    depends_on:
      wordpress:
        condition: service_healthy
    networks:
      - inception

  wordpress:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ${VOLUME_BASE}/data/wordpress_files:/var/www/html
    environment:
      - WORDPRESS_DB_HOST=mariadb
      - WORDPRESS_DB_NAME=${DB_NAME}
      - WORDPRESS_DB_USER=${DB_USER}
      - WORDPRESS_URL=https://${LOGIN}.42.fr
      - WORDPRESS_TITLE=${WP_TITLE}
      - WORDPRESS_ADMIN_USER=${WP_ADMIN_USER}
      - WORDPRESS_ADMIN_EMAIL=${WP_ADMIN_EMAIL}
      - WORDPRESS_USER=${WP_USER}
      - WORDPRESS_USER_EMAIL=${WP_USER_EMAIL}
    secrets:
      - mysql_password
      - wp_admin_pass
      - wp_user_pass
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - inception

  mariadb:
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ${VOLUME_BASE}/data/wordpress_db:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
    secrets:
      - mysql_password
      - mysql_root_password
    networks:
      - inception

secrets:
  mysql_password:
    file: ../secrets/mysql_password.txt
  mysql_root_password:
    file: ../secrets/mysql_root_password.txt
  wp_admin_pass:
    file: ../secrets/wp_admin_pass.txt
  wp_user_pass:
    file: ../secrets/wp_user_pass.txt

networks:
  inception:
    driver: bridge
