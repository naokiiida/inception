#_preseed_V1
#### Minimal Debian Preseed Configuration for Docker Host
#### Requirements: user:user, UTF-8, US keyboard, Japan timezone

### Localization
# Locale settings
d-i debian-installer/locale string ja_JP.UTF-8
d-i debian-installer/language string ja
d-i debian-installer/country string JP
# Set LC_ALL environment variable
d-i preseed/early_command string echo 'LC_ALL=ja_JP.UTF-8' >> /etc/environment

# Keyboard selection - US layout
d-i keyboard-configuration/xkb-keymap select us

### Network configuration
# Automatic network configuration
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string debian-docker
d-i netcfg/get_domain string localdomain
d-i netcfg/wireless_wep string

# Disable firmware prompts
d-i hw-detect/load_firmware boolean true

### Mirror settings
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Account setup
# Skip creation of a root account (normal user account will be able to use sudo)
d-i passwd/root-login boolean false

# Regular user account with username "user" and password "user"
d-i passwd/user-fullname string User
d-i passwd/username string user
d-i passwd/user-password password user
d-i passwd/user-password-again password user
d-i passwd/user-default-groups string audio cdrom video sudo docker

### Clock and time zone setup
# Hardware clock set to UTC
d-i clock-setup/utc boolean true

# Timezone set to Japan (Asia/Tokyo)
d-i time/zone string Asia/Tokyo

# Use NTP to set the clock
d-i clock-setup/ntp boolean true

### Partitioning
# Use LVM partitioning
d-i partman-auto/method string lvm
d-i partman-auto-lvm/guided_size string max

# Remove existing LVM/RAID configurations without prompting
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true

# Use atomic recipe (all files in one partition)
d-i partman-auto/choose_recipe select atomic

# Confirm partitioning without prompting
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Base system installation
# Install standard kernel
d-i base-installer/kernel/image string linux-image-amd64

### Apt setup
# Don't scan additional media
d-i apt-setup/cdrom/set-first boolean false

# Enable non-free firmware (may be needed for hardware)
d-i apt-setup/non-free-firmware boolean true

# Use network mirror
d-i apt-setup/use_mirror boolean true

# Enable security updates
d-i apt-setup/services-select multiselect security, updates

### Package selection
# Skip tasksel - we'll install minimal packages only
d-i pkgsel/run_tasksel boolean false

# Install minimal packages required for Docker installation
# Based on installDocker.md requirements plus essential tools
d-i pkgsel/include string openssh-server sudo curl wget git make ca-certificates gnupg lsb-release dkms linux-headers-amd64 rsync

# Don't upgrade packages during installation (faster)
d-i pkgsel/upgrade select none

# Don't participate in popularity contest
popularity-contest popularity-contest/participate boolean false

### Boot loader installation
# Install GRUB automatically
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

### Finishing up the installation
# Avoid final message and reboot automatically
d-i finish-install/reboot_in_progress note

### Post-installation Docker setup and SSH key configuration
d-i preseed/late_command string \
    in-target sh -c 'install -m 0755 -d /etc/apt/keyrings'; \
    in-target sh -c 'curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc'; \
    in-target sh -c 'chmod a+r /etc/apt/keyrings/docker.asc'; \
    in-target sh -c 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list'; \
    in-target sh -c 'apt-get update'; \
    in-target sh -c 'apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin'; \
    in-target sh -c 'systemctl enable docker'; \
    in-target sh -c 'usermod -aG docker user'; \
    in-target sh -c 'mkdir -p /home/user/.ssh && chmod 700 /home/user/.ssh'; \
    in-target sh -c 'echo "SSH_PUBLIC_KEY_PLACEHOLDER" > /home/user/.ssh/authorized_keys'; \
    in-target sh -c 'chmod 600 /home/user/.ssh/authorized_keys'; \
    in-target sh -c 'chown -R user:user /home/user/.ssh'; \
    in-target sh -c 'sed -i "s/#PubkeyAuthentication yes/PubkeyAuthentication yes/" /etc/ssh/sshd_config'; \
    in-target sh -c 'sed -i "s/#PasswordAuthentication yes/PasswordAuthentication no/" /etc/ssh/sshd_config'; \
    in-target sh -c 'sed -i "s/PasswordAuthentication yes/PasswordAuthentication no/" /etc/ssh/sshd_config'; \
    in-target sh -c 'echo "export LC_ALL=ja_JP.UTF-8" >> /home/user/.bashrc'; \
    in-target sh -c 'echo "export LC_ALL=ja_JP.UTF-8" >> /etc/profile'


